[project]
name = "riabita"
version = "0.1.0"
description = "RIABITA ROMA, an urban simulation game built on the Riabitability Index."
requires-python = ">=3.11"
dependencies = ["geopandas>=0.14"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
mypy_path = "src"

[tool.pyright]
extraPaths = ["src"]
